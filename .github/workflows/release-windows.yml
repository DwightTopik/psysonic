name: Release animated covers for Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out animated-covers branch
        uses: actions/checkout@v7
        with:
          ref: feature/animated-covers

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify CMake
        run: cmake --version

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check frontend
        run: |
          npm run prebuild:release-notes
          npm exec tsc -- --noEmit

      - name: Build unsigned Windows bundles
        run: npm run tauri:build

      - name: Create release and attach Windows installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: pwsh
        run: |
          $assets = @()
          $assets += Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -File -ErrorAction SilentlyContinue
          $assets += Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -File -ErrorAction SilentlyContinue

          if ($assets.Count -eq 0) {
            throw 'No Windows distributable files were generated.'
          }

          $date = (Get-Date).ToUniversalTime().ToString('yyyy.MM.dd')
          $tag = "animated-$date.$env:RUN_NUMBER"
          $title = "Psysonic Animated Covers $date #$env:RUN_NUMBER"
          $sha = (git rev-parse HEAD).Trim()

          @"
          This is a personal/custom Psysonic build.

          - Based on the current feature/animated-covers branch.
          - Adds animated current-track artwork support.
          - Includes animated artwork in the player bar, Now Playing, and fullscreen surfaces.
          - Static artwork cache behavior remains unchanged for normal library thumbnails.
          - This build is not an official Psysonic release.

          Build details:

          - Exact commit SHA: $sha
          - Upstream repository: https://github.com/Psysonic/psysonic
          - Fork branch: feature/animated-covers
          "@ | Set-Content -Path release-notes.md -Encoding utf8

          $assetPaths = $assets | ForEach-Object { $_.FullName }
          gh release create $tag $assetPaths `
            --repo $env:GITHUB_REPOSITORY `
            --target $sha `
            --title $title `
            --notes-file release-notes.md
