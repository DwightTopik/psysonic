name: Build animated covers for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/animated-covers
  # GITHUB_TOKEN pushes do not start other workflows, so listen for the sync
  # workflow directly as well as ordinary pushes to the feature branch.
  workflow_run:
    workflows:
      - Sync animated covers with upstream
    types:
      - completed

permissions:
  contents: read

jobs:
  build-windows:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - name: Check out animated-covers branch
        uses: actions/checkout@v7
        with:
          ref: feature/animated-covers

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify CMake
        run: cmake --version

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check frontend
        run: |
          npm run prebuild:release-notes
          npm exec tsc -- --noEmit

      - name: Build unsigned Windows bundles
        run: npm run tauri:build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: psysonic-animated-covers-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
