name: Build animated covers for Windows

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the generated installers as a GitHub Release
        required: false
        default: false
        type: boolean
  push:
    branches:
      - feature/animated-covers

permissions:
  contents: write

concurrency:
  group: build-windows-animated-covers
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out animated-covers branch
        uses: actions/checkout@v7
        with:
          ref: feature/animated-covers
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify CMake
        run: cmake --version

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check frontend
        run: |
          npm run prebuild:release-notes
          npm exec tsc -- --noEmit

      - name: Build unsigned Windows bundles
        run: npm run tauri:build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: psysonic-animated-covers-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release from the built installers
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: pwsh
        run: |
          git remote add upstream https://github.com/Psysonic/psysonic.git
          git fetch --no-tags upstream main

          $assets = @()
          $assets += Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -File -ErrorAction SilentlyContinue
          $assets += Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -File -ErrorAction SilentlyContinue
          if ($assets.Count -eq 0) {
            throw 'No Windows distributable files were generated.'
          }

          $date = (Get-Date).ToUniversalTime().ToString('yyyy.MM.dd')
          $tag = "animated-$date.$env:RUN_NUMBER"
          $upstreamVersion = (node -p "require('./package.json').version").Trim()
          $customSha = (git rev-parse HEAD).Trim()
          $upstreamSha = (git merge-base HEAD upstream/main).Trim()
          $title = "Psysonic $upstreamVersion + Animated Covers — $date #$env:RUN_NUMBER"

          if (git ls-remote --exit-code --tags origin "refs/tags/$tag" 2>$null) {
            throw "Tag already exists: $tag"
          }

          @"
          This is a personal/custom build and is not an official Psysonic release.

          Build details:

          - Upstream Psysonic version: $upstreamVersion
          - Exact upstream commit SHA: $upstreamSha
          - Exact custom commit SHA: $customSha
          - Upstream repository: https://github.com/Psysonic/psysonic
          - Fork branch: feature/animated-covers

          Feature summary:

          - Animated current-track artwork
          - Player Bar
          - Now Playing
          - Fullscreen foreground artwork
          - Animated fullscreen background
          - Existing static library-thumbnail/cache behavior remains unchanged
          "@ | Set-Content -Path release-notes.md -Encoding utf8

          $assetPaths = $assets | ForEach-Object { $_.FullName }
          gh release create $tag $assetPaths `
            --repo $env:GITHUB_REPOSITORY `
            --target $customSha `
            --title $title `
            --notes-file release-notes.md
